services:
  # ==========================================
  # PostgreSQL Database Service
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: privatechat_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-privatechat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-privatechat_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-privatechat}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-privatechat} -d ${POSTGRES_DB:-privatechat}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # FastAPI Backend Service
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: privatechat_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-privatechat}:${POSTGRES_PASSWORD:-privatechat_secure_pass}@db:5432/${POSTGRES_DB:-privatechat}
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_secure_32_character_secret_key}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      PORT: 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ==========================================
  # Next.js Frontend Service
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws/chat}
    container_name: privatechat_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production

volumes:
  pgdata:
    driver: local
