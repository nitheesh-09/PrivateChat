services:
  # ==========================================
  # Backend API (FastAPI + Uvicorn)
  # ==========================================
  - type: web
    name: privatechat-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: privatechat-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none"
      - key: CORS_ORIGINS
        value: https://privatechat-frontend.onrender.com

  # ==========================================
  # Frontend UI (Next.js)
  # ==========================================
  - type: web
    name: privatechat-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_OPTIONS
        value: "--max-old-space-size=460"
      - key: NEXT_PUBLIC_API_URL
        value: https://privatechat-backend-7it3.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: wss://privatechat-backend-7it3.onrender.com/ws/chat

databases:
  # ==========================================
  # Managed PostgreSQL Database
  # ==========================================
  - name: privatechat-db
    databaseName: privatechat
    user: privatechat
    plan: free
